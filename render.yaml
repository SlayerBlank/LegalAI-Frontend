services:
  - type: web
    name: legalai-frontend
    runtime: static
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npm run build -- --configuration production
    staticPublishPath: dist/legalai-frontend/browser
    envVars:
      - key: NODE_VERSION
        value: '24.16.0'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
