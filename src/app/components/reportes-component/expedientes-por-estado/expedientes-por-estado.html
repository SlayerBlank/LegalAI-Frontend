<app-report-shell
  hu="HU-139"
  titleKey="reports.r139.title"
  descriptionKey="reports.r139.description"
  emptyKey="reports.emptyFiltered"
  [query]="query"
>
  <form
    reportFilters
    class="filters"
    novalidate
    [attr.aria-label]="'reports.filters' | t"
    (ngSubmit)="apply()"
  >
    <label class="field">
      <span>{{ 'reports.openedFrom' | t }}</span>
      <input
        type="date"
        name="from"
        [(ngModel)]="from"
        [attr.aria-invalid]="rangeError() ? 'true' : null"
        aria-describedby="r139-filter-error"
      />
    </label>
    <label class="field">
      <span>{{ 'reports.openedTo' | t }}</span>
      <input
        type="date"
        name="to"
        [(ngModel)]="to"
        [attr.aria-invalid]="rangeError() ? 'true' : null"
        aria-describedby="r139-filter-error"
      />
    </label>
    <div class="filter-actions">
      <button class="primary" type="submit">{{ 'reports.apply' | t }}</button>
      <button type="button" (click)="clear()">{{ 'reports.clear' | t }}</button>
    </div>
    <p class="filter-error" id="r139-filter-error" role="alert">
      @if (filterError()) {
        {{ filterError() | t }}
      }
    </p>
  </form>

  @if (query.hasData()) {
    <div class="report-grid">
      <app-report-chart
        type="bar"
        [rows]="rows()"
        [seriesLabel]="'reports.colCases' | t"
        [label]="'reports.r139.title' | t"
      />
      <app-report-table
        [rows]="rows()"
        [caption]="'reports.r139.caption' | t"
        [labelHeader]="'reports.colStatus' | t"
        [countHeader]="'reports.colCases' | t"
      />
    </div>
  }
</app-report-shell>
