<app-report-shell
  hu="HU-124"
  titleKey="reports.r124.title"
  descriptionKey="reports.r124.description"
  emptyKey="reports.r124.empty"
  [query]="query"
>
  @if (query.hasData()) {
    <div class="report-grid">
      <app-report-chart
        type="bar"
        [horizontal]="true"
        [rows]="rows()"
        [seriesLabel]="'reports.colSessions' | t"
        [label]="'reports.r124.title' | t"
      />
      <app-report-table
        [rows]="rows()"
        [caption]="'reports.r124.caption' | t"
        [labelHeader]="'reports.colCase' | t"
        [countHeader]="'reports.colSessions' | t"
      />
    </div>
  }
</app-report-shell>
