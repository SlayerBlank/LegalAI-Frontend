<app-report-shell
  hu="HU-137"
  titleKey="reports.r137.title"
  descriptionKey="reports.r137.description"
  emptyKey="reports.emptyFiltered"
  [query]="query"
>
  <form
    reportFilters
    class="filters"
    novalidate
    [attr.aria-label]="'reports.filters' | t"
    (ngSubmit)="apply()"
  >
    <label class="field wide">
      <span>{{ 'reports.case' | t }}</span>
      <select name="caseId" [(ngModel)]="caseId">
        <option [ngValue]="null">{{ 'reports.allCases' | t }}</option>
        @for (item of cases(); track item.caseId) {
          <option [ngValue]="item.caseId">{{ item.title }}</option>
        }
      </select>
    </label>
    <label class="field">
      <span>{{ 'reports.updatedFrom' | t }}</span>
      <input
        type="date"
        name="from"
        [(ngModel)]="from"
        [attr.aria-invalid]="rangeError() ? 'true' : null"
        aria-describedby="r137-filter-error"
      />
    </label>
    <label class="field">
      <span>{{ 'reports.updatedTo' | t }}</span>
      <input
        type="date"
        name="to"
        [(ngModel)]="to"
        [attr.aria-invalid]="rangeError() ? 'true' : null"
        aria-describedby="r137-filter-error"
      />
    </label>
    <div class="filter-actions">
      <button class="primary" type="submit">{{ 'reports.apply' | t }}</button>
      <button type="button" (click)="clear()">{{ 'reports.clear' | t }}</button>
    </div>
    <p class="filter-error" id="r137-filter-error" role="alert">
      @if (filterError()) {
        {{ filterError() | t }}
      }
    </p>
  </form>

  @if (query.hasData()) {
    <div class="report-grid">
      <app-report-chart
        type="doughnut"
        [rows]="rows()"
        [seriesLabel]="'reports.colDrafts' | t"
        [label]="'reports.r137.title' | t"
      />
      <app-report-table
        [rows]="rows()"
        [swatches]="true"
        [caption]="'reports.r137.caption' | t"
        [labelHeader]="'reports.colStatus' | t"
        [countHeader]="'reports.colDrafts' | t"
      />
    </div>
  }
</app-report-shell>
