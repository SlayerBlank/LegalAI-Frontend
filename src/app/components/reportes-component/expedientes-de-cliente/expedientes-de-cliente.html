<app-report-shell
  hu="HU-131"
  titleKey="reports.r131.title"
  descriptionKey="reports.r131.description"
  emptyKey="reports.r131.empty"
  idleKey="reports.r131.idle"
  [query]="query"
>
  <form
    reportFilters
    class="filters"
    novalidate
    [attr.aria-label]="'reports.filters' | t"
    (ngSubmit)="apply()"
  >
    <label class="field wide">
      <span>{{ 'reports.client' | t }}</span>
      <select
        name="clientId"
        [(ngModel)]="clientId"
        [attr.aria-invalid]="filterError() === 'reports.r131.errClient' ? 'true' : null"
        aria-describedby="r131-filter-error"
      >
        <option [ngValue]="null">{{ 'reports.selectClient' | t }}</option>
        @for (client of clients(); track client.clientId) {
          <option [ngValue]="client.clientId">{{ client.fullNameOrCompany }}</option>
        }
      </select>
    </label>
    <label class="field">
      <span>{{ 'reports.openedFrom' | t }}</span>
      <input
        type="date"
        name="from"
        required
        [(ngModel)]="from"
        [attr.aria-invalid]="rangeError() ? 'true' : null"
        aria-describedby="r131-filter-error"
      />
    </label>
    <label class="field">
      <span>{{ 'reports.openedTo' | t }}</span>
      <input
        type="date"
        name="to"
        required
        [(ngModel)]="to"
        [attr.aria-invalid]="rangeError() ? 'true' : null"
        aria-describedby="r131-filter-error"
      />
    </label>
    <div class="filter-actions">
      <button class="primary" type="submit">{{ 'reports.consult' | t }}</button>
    </div>
    @if (clientsError()) {
      <p class="filter-hint">
        {{ 'reports.r131.clientsError' | t }}
        <button class="link-button" type="button" (click)="loadClients()">
          {{ 'reports.retry' | t }}
        </button>
      </p>
    }
    <p class="filter-error" id="r131-filter-error" role="alert">
      @if (filterError()) {
        {{ filterError() | t }}
      }
    </p>
  </form>

  @if (query.hasData()) {
    <div class="report-grid">
      <app-report-chart
        type="doughnut"
        [rows]="rows()"
        [seriesLabel]="'reports.colCases' | t"
        [label]="'reports.r131.title' | t"
      />
      <app-report-table
        [rows]="rows()"
        [swatches]="true"
        [caption]="'reports.r131.caption' | t"
        [labelHeader]="'reports.colStatus' | t"
        [countHeader]="'reports.colCases' | t"
      />
    </div>
  }
</app-report-shell>
