<app-report-shell
  hu="HU-135"
  titleKey="reports.r135.title"
  descriptionKey="reports.r135.description"
  emptyKey="reports.r135.empty"
  [query]="query"
>
  @if (query.hasData()) {
    <div class="report-grid">
      <app-report-chart
        type="bar"
        [horizontal]="true"
        [rows]="rows()"
        [seriesLabel]="'reports.colDocuments' | t"
        [label]="'reports.r135.title' | t"
      />
      <app-report-table
        [rows]="rows()"
        [caption]="'reports.r135.caption' | t"
        [labelHeader]="'reports.colClient' | t"
        [countHeader]="'reports.colDocuments' | t"
      />
    </div>
  }
</app-report-shell>
