<header>
  <div class="route-area">
    <button
      class="menu-trigger"
      type="button"
      [attr.aria-label]="(menuOpen() ? 'sidebar.closeNav' : 'sidebar.openNav') | t"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="workspace-sidebar"
      (click)="menuRequested.emit()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
    </button>
    <p class="route-context">
      <span class="current-path">{{ currentPath() }}</span
      ><span class="divider" aria-hidden="true">/</span><span>{{ selectedTheme }}</span
      ><span class="divider" aria-hidden="true">·</span
      ><span class="session-state">{{
        (loginService.state() === 'authenticated' ? 'navbar.sessionActive' : 'navbar.sessionChecking')
          | t
      }}</span>
    </p>
  </div>
  <div class="navbar-actions">
    <app-language-switcher />
    <app-region-switcher />
    <div class="theme-switch" role="group" [attr.aria-label]="'navbar.appearance' | t">
      @for (option of options; track option.value) {
        <button
          type="button"
          [attr.aria-pressed]="theme.preference() === option.value"
          [attr.data-theme-option]="option.value"
          (click)="theme.setPreference(option.value)"
        >
          {{ option.labelKey | t }}
        </button>
      }
    </div>
    <button
      class="notifications"
      type="button"
      disabled
      [attr.aria-label]="'navbar.notificationsLabel' | t"
      [title]="'navbar.notificationsTitle' | t"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
      </svg></button
    ><time [attr.datetime]="now().toISOString()">{{ today }}</time>
  </div>
</header>
