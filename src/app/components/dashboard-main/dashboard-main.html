<div class="shell">
  <app-sidebar [open]="sidebarOpen()" [compact]="compact()" (closeRequested)="closeSidebar()" />
  <div class="content" [attr.inert]="compact() && sidebarOpen() ? '' : null">
    <app-navbar [menuOpen]="sidebarOpen()" (menuRequested)="toggleSidebar()" />
    <main id="workspace-content"><router-outlet /></main>
  </div>
</div>
