<main class="auth-page"><div class="card"><button class="back-button" type="button" title="Volver" aria-label="Volver" (click)="goBack()">←</button><div class="head"><a routerLink="/landing" class="brand">Legal<span>AI</span></a><button type="button" aria-label="Cambiar tema" (click)="theme.toggle()">{{theme.theme()==='light'?'☾':'☀'}}</button></div><h1>Iniciar sesión</h1><p>Accede a tu espacio de gestión legal.</p><form [formGroup]="form" (ngSubmit)="submit()"><label>Correo<input type="email" formControlName="email" placeholder="nombre@ejemplo.com">@if(form.controls.email.touched&&form.controls.email.invalid){<small>Introduce un correo válido.</small>}</label><label>Contraseña<div class="password"><input [type]="showPassword?'text':'password'" formControlName="password"><button type="button" (click)="showPassword=!showPassword">{{showPassword?'Ocultar':'Mostrar'}}</button></div>@if(form.controls.password.touched&&form.controls.password.invalid){<small>La contraseña es obligatoria.</small>}</label><button class="submit" type="submit" [disabled]="loading">{{loading?'Iniciando sesión…':'Iniciar sesión'}}</button></form>@if(message){<div class="message" role="alert">{{message}}</div>}<p class="switch">¿No tienes cuenta? <a routerLink="/usuarios/registrar">Regístrate</a></p></div></main>
