<main class="auth-page"><div class="card"><button class="back-button" type="button" title="Volver" aria-label="Volver" (click)="goBack()">←</button><div class="head"><a routerLink="/landing" class="brand">Legal<span>AI</span></a><button type="button" aria-label="Cambiar tema" (click)="theme.toggle()">{{theme.theme()==='light'?'☾':'☀'}}</button></div><h1>Crear cuenta</h1><p>Prepara tu espacio de trabajo legal.</p><form [formGroup]="form" (ngSubmit)="submit()"><label>Nombre completo<input formControlName="fullName" placeholder="Tu nombre">@if(form.controls.fullName.touched&&form.controls.fullName.invalid){<small>El nombre es obligatorio y admite hasta 150 caracteres.</small>}</label><label>Correo<input type="email" formControlName="email" placeholder="nombre@ejemplo.com">@if(form.controls.email.touched&&form.controls.email.invalid){<small>Introduce un correo válido de hasta 150 caracteres.</small>}</label><label>Contraseña<input type="password" formControlName="password">@if(form.controls.password.touched&&form.controls.password.hasError('minlength')){<small>La contraseña debe tener al menos 8 caracteres.</small>}@if(form.controls.password.touched&&form.controls.password.hasError('maxlength')){<small>La contraseña no puede superar 100 caracteres.</small>}@if(form.controls.password.touched&&form.controls.password.hasError('maxBytes')){<small>La contraseña no puede superar 72 bytes UTF-8.</small>}</label><label>Confirmar contraseña<input type="password" formControlName="confirmPassword">@if(form.controls.confirmPassword.touched&&form.hasError('mismatch')){<small>Las contraseñas no coinciden.</small>}</label><button class="submit" type="submit" [disabled]="loading">{{loading?'Registrando…':'Registrarse'}}</button></form>@if(message){<div class="message" role="alert">{{message}}</div>}<p class="switch">¿Ya tienes cuenta? <a routerLink="/usuarios/login">Inicia sesión</a></p></div></main>
