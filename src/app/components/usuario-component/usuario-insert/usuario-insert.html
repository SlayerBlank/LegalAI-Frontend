<main class="auth-page"><div class="card"><div class="head"><a routerLink="/landing" class="brand">Legal<span>AI</span></a><button (click)="theme.toggle()">{{theme.theme()==='light'?'☾':'☀'}}</button></div><h1>Crear cuenta</h1><p>Prepara tu espacio de trabajo legal.</p><form [formGroup]="form" (ngSubmit)="submit()"><label>Nombre<input formControlName="name" placeholder="Tu nombre">@if(form.controls.name.touched&&form.controls.name.invalid){<small>El nombre es obligatorio.</small>}</label><label>Correo<input type="email" formControlName="email" placeholder="nombre@ejemplo.com">@if(form.controls.email.touched&&form.controls.email.invalid){<small>Introduce un correo válido.</small>}</label><label>Contraseña<input type="password" formControlName="password"></label><label>Confirmar contraseña<input type="password" formControlName="confirmPassword">@if(form.touched&&form.hasError('mismatch')){<small>Las contraseñas no coinciden.</small>}</label><button class="submit">Registrarse</button></form>@if(message){<div class="message">{{message}}</div>}<p class="switch">¿Ya tienes cuenta? <a routerLink="/usuarios/login">Inicia sesión</a></p></div></main>
