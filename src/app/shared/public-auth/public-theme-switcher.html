<div class="theme-options" role="group" [attr.aria-label]="'public.appearance' | t">
  @for (option of options; track option.value) {
    <button
      type="button"
      [attr.data-theme-option]="option.value"
      [attr.aria-pressed]="theme.preference() === option.value"
      (click)="theme.setPreference(option.value)"
    >
      {{ option.labelKey | t }}
    </button>
  }
</div>
